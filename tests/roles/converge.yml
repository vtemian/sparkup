---
# Run one role per container so a failure names the role that caused it.
# site.yml's own ordering is not reproduced here: docker, gpu, exporters and
# monitoring are not in this file at all, because a container cannot honestly
# stand in for a GPU, a driver, or a machine on a network. See
# tests/role-idempotence.sh, which prints that scope before it runs.
- name: Converge the base role in a container
  hosts: sparkup-test-base
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all.yml"
    - "{{ playbook_dir }}/vars.yml"
  roles:
    - role: base

- name: Converge the users role in a container
  hosts: sparkup-test-users
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../../group_vars/all.yml"
    - "{{ playbook_dir }}/vars.yml"
  roles:
    - role: users

# A container has no Secure Boot, no fwupd daemon, no GPU and no hwmon, which is
# the case worth testing: the report is the first thing a stranger runs, and
# every value in it is missing here. A template that raised on an undefined
# register would fail this play. It is also read-only, so it belongs in a run
# that asserts changed=0.
- name: Render the report in a container where nothing it reads exists
  hosts: sparkup-test-base
  gather_facts: true
  roles:
    - role: report
