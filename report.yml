---
# Read-only counterpart to site.yml. Deliberately carries none of that play's
# preconditions: this has to run on a fresh clone with no host_vars and on a box
# nobody has decided to converge, which is exactly when the answer is wanted.
- name: Report what this box is, without changing it
  hosts: spark
  become: false
  gather_facts: true

  roles:
    - role: report
      tags: [report]
