---
- name: Provision the DGX Spark
  hosts: spark
  become: true
  gather_facts: true
  # Handlers run in definition order across every role, and a failing handler
  # would otherwise skip the ones behind it — leaving new exporter units never
  # reloaded and a new prometheus.yml never read.
  force_handlers: true

  pre_tasks:
    - name: Detect training processes on the GPU
      ansible.builtin.command: nvidia-smi --query-compute-apps=pid,process_name --format=csv,noheader
      register: spark_gpu_apps
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Record whether the box is training
      ansible.builtin.set_fact:
        spark_training_active: "{{ (spark_gpu_apps.stdout | default('') | trim) | length > 0 }}"

    - name: Warn that a training run owns the box
      ansible.builtin.debug:
        msg: >-
          A GPU process is running ({{ spark_gpu_apps.stdout | trim }}).
          Container restarts are survivable; a reboot is not.
      when: spark_training_active

  roles:
    - role: base
      tags: [base]
    # docker before users: ansible.builtin.user fails hard when a group named in
    # `groups:` does not exist, and users are put in the docker group.
    - role: docker
      tags: [docker]
    - role: gpu
      tags: [gpu]
      when: gpu_enabled | bool
    - role: users
      tags: [users]
    - role: exporters
      tags: [exporters]
    # Before monitoring: the exporter must exist before Prometheus is told to
    # scrape it. A complete no-op until shelly_enabled is true.
    - role: shelly
      tags: [shelly]
    - role: monitoring
      tags: [monitoring]
    # Everything in here is inert unless switched on: the clock cap ships
    # disabled, fwupd is left alone, and the firmware assertion is skipped until
    # you record your own EC version in host_vars.
    - role: thermal
      tags: [thermal]
    # LAST, ALONE, and off by default. This is the one role that can leave a
    # headless WiFi-only box unbootable. Run it with --tags kernel, deliberately,
    # with someone able to walk to the machine.
    - role: kernel
      tags: [kernel]
      when: kernel_enabled | bool
