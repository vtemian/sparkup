---
# THIS ROLE STAGES FIRMWARE AND NEVER REBOOTS. `--no-reboot-check` is what
# enforces it: without the flag `fwupdmgr update` offers to reboot and can act.
#
# Staging runs on every converge: the SPBM power channels report incorrect CPU
# values on older EC firmware, so a box behind on firmware reports bad numbers.

- name: Look for the firmware update client
  ansible.builtin.stat:
    path: "{{ firmware_fwupdmgr }}"
  register: firmware_client

- name: Stage firmware updates
  when: firmware_client.stat.exists
  block:

    # rc 2 is fresh cache, rc 101 is LVFS unreachable. Both leave the check
    # below reading the cache — degraded but safe, so nothing fails here.
    - name: Refresh the firmware metadata
      ansible.builtin.command:
        cmd: "{{ firmware_fwupdmgr }} refresh"
      changed_when: false
      failed_when: false
      check_mode: false

    # rc 0 means the vendor is offering something; rc 2 is a converged box.
    - name: Read whether the vendor is offering firmware
      ansible.builtin.command:
        cmd: "{{ firmware_fwupdmgr }} get-updates --no-unreported-check"
      register: firmware_updates
      changed_when: false
      failed_when: firmware_updates.rc not in [0, 2]
      check_mode: false

    # Only reached when something is on offer, so it always changes something.
    - name: Stage the firmware capsules
      ansible.builtin.command:
        cmd: >-
          {{ firmware_fwupdmgr }} update --assume-yes --no-reboot-check
          --no-unreported-check
      changed_when: true
      when: firmware_updates.rc == 0

# Outside the block and unconditional: once a capsule is staged `get-updates`
# stops offering it, so "armed and waiting for a reboot" reads as "current".
- name: Look for firmware capsules already staged
  ansible.builtin.find:
    paths: "{{ firmware_capsule_dir }}"
    patterns: "*.cap"
    file_type: file
  register: firmware_capsules
  changed_when: false
  check_mode: false

- name: Warn that the next boot will write firmware
  ansible.builtin.debug:
    msg: >-
      {{ firmware_capsules.matched }} firmware capsule(s) are staged in
      {{ firmware_capsule_dir }}. THE NEXT REBOOT WILL WRITE THEM, whoever
      performs it and for whatever reason. Keep the machine powered
      throughout; an interrupted write is not recoverable on this hardware.
      To cancel instead, delete them — fwupd has no command that will:
      rm {{ firmware_capsule_dir }}/*.cap
  when: firmware_capsules.matched | int > 0
