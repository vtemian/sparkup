---
# THIS ROLE STAGES FIRMWARE. IT NEVER REBOOTS.
#
# fwupd writes a capsule that UEFI applies during the next boot, so the flash
# does not happen while this runs — it happens while the machine is restarting,
# with no way to intervene. That is the moment a box can be lost, and choosing
# it belongs to whoever can watch the machine. Same shape as the kernel role:
# converge what can be converged, then say what a human has to do.
#
# Because nothing is applied until that reboot, a staged capsule is reversible:
# `fwupdmgr clear-results` and it never happens. That is what makes tracking
# the vendor's current release safer than pinning a version that goes stale
# while security and stability fixes pile up behind it.

- name: Stage firmware updates
  when: firmware_update_enabled | bool
  block:

    - name: Refuse to flash firmware while the box is training
      ansible.builtin.assert:
        that:
          - not (spark_training_active | default(false))
        fail_msg: >-
          A GPU process is running. Applying firmware needs a reboot, and a
          reboot kills the run. Wait for it to finish.
        success_msg: Nothing is training.

    - name: Look for the firmware update client
      ansible.builtin.stat:
        path: "{{ firmware_fwupdmgr }}"
      register: firmware_client

    - name: Report that firmware cannot be managed without fwupd
      ansible.builtin.debug:
        msg: >-
          {{ firmware_fwupdmgr }} is not installed, so firmware state can be
          neither read nor changed. Every firmware task is skipped.
      when: not firmware_client.stat.exists

    - name: Manage firmware through fwupd
      when: firmware_client.stat.exists
      block:

        # Downloads the vendor catalogue. Touches no firmware, so it is not a
        # change; without it the update check below reads stale metadata.
        - name: Refresh the firmware metadata
          ansible.builtin.command:
            cmd: "{{ firmware_fwupdmgr }} refresh --force --assume-yes"
          register: firmware_refresh
          changed_when: false
          failed_when: false
          check_mode: false
          when: firmware_refresh_metadata | bool

        - name: Read what the vendor is offering
          ansible.builtin.command:
            cmd: "{{ firmware_fwupdmgr }} get-updates --json --no-unreported-check"
          register: firmware_offered
          changed_when: false
          # rc 2 is fwupd's "nothing to do", which is a converged box, not a
          # failure. Anything else is left to fail loudly.
          failed_when: firmware_offered.rc not in [0, 2]
          check_mode: false

        - name: Work out which devices have an update pending
          ansible.builtin.set_fact:
            firmware_pending: >-
              {{ (firmware_offered.stdout | from_json).Devices | default([])
                 | selectattr('Releases', 'defined')
                 | rejectattr('DeviceId', 'in', firmware_exclude_devices)
                 | list }}
          when: firmware_offered.stdout | default('') | trim | length > 0

        - name: Report the firmware updates on offer
          ansible.builtin.debug:
            msg: >-
              {{ item.Name }} ({{ item.DeviceId }}):
              {{ item.Version }} -> {{ (item.Releases | first).Version }}
              [{{ (item.Releases | first).Urgency | default('unknown') }} urgency]
          loop: "{{ firmware_pending | default([]) }}"
          loop_control:
            label: "{{ item.Name }}"

        # Idempotent by construction: once every device is current, fwupd offers
        # nothing, firmware_pending is empty, and this does not run. A second
        # converge reports changed=0 without reinstalling anything.
        - name: Stage the firmware capsules
          ansible.builtin.command:
            cmd: >-
              {{ firmware_fwupdmgr }} update --assume-yes --no-reboot-check
              --no-unreported-check
          register: firmware_staged
          changed_when: firmware_staged.rc == 0
          failed_when: firmware_staged.rc not in [0, 2]
          when: firmware_pending | default([]) | length > 0

        - name: Report what a reboot will apply
          ansible.builtin.debug:
            msg: >-
              {% if firmware_pending | default([]) | length > 0 %}
              STAGED, NOT APPLIED. UEFI writes
              {{ firmware_pending | map(attribute='Name') | join(', ') }}
              during the next boot. This role does not reboot: the flash happens
              while the machine is restarting with no way to intervene. Keep it
              powered throughout. Nothing has changed yet, so
              `fwupdmgr clear-results` still cancels it.
              Afterwards, move thermal_expected_ec_firmware to the new version
              or the thermal role will correctly report drift.
              {% else %}
              Every device is already on the firmware the vendor offers. Nothing
              staged, no reboot needed.
              {% endif %}

    - name: Skip devices the operator excluded
      ansible.builtin.debug:
        msg: "Left alone by firmware_exclude_devices: {{ firmware_exclude_devices | join(', ') }}"
      when: firmware_exclude_devices | length > 0
