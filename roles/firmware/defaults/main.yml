---
# Off. A converge on a box that has not opted in does nothing here.
#
# Turning it on means "keep this machine's firmware current". It does not mean
# "flash on every converge": nothing reaches the hardware until somebody
# reboots, and this role never does that.
firmware_update_enabled: false

# Devices to leave alone, by fwupd device id. Empty means everything the vendor
# offers. Use it when one component is known bad on a newer release.
firmware_exclude_devices: []

# Refresh LVFS metadata before checking. Downloads a catalogue; touches no
# firmware. Off works from whatever metadata is already cached.
firmware_refresh_metadata: true

firmware_fwupdmgr: /usr/bin/fwupdmgr
