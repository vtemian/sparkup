---
# DGX OS ships these from NVIDIA's repo. `state: present` converges what the
# vendor installed; never chase latest and never race the vendor's pinned build.
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin

docker_group: docker
docker_config_dir: /etc/docker

# Registered as a named runtime, deliberately NOT as `default-runtime`.
docker_nvidia_runtime_path: nvidia-container-runtime

# Unbounded json-file logs are a slow disk leak on multi-day jobs. 150 MB cap.
docker_log_driver: json-file
docker_log_max_size: 50m
docker_log_max_file: 3

# Same host:port the registry role publishes. HTTP on purpose (LAN trust = ssh
# trust), so dockerd on this box will not pull without this entry. Duplicated
# rather than borrowed from registry defaults: this role runs first, and a
# `--tags docker` converge still has to write the right daemon.json.
docker_insecure_registry: "{{ spark_hostname }}.local:5000"
