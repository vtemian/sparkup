---
# Restarting dockerd stops every running container, including a training run.
# The new daemon.json is already on disk either way, so refusing costs nothing
# but a second converge, while restarting costs somebody their run.
- name: Refuse to restart Docker while a training run owns the box
  ansible.builtin.fail:
    msg: >-
      {{ docker_config_dir }}/daemon.json changed, so dockerd has to restart —
      but nvidia-smi reports an active GPU compute process. A restart stops
      every running container, that run included. The new daemon.json is
      already on disk and takes effect at the next restart, so wait for the run
      to finish and re-run the playbook.
  listen: Docker configuration changed
  when: spark_training_active | default(false) | bool

- name: Restart Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  listen: Docker configuration changed
  when: not (spark_training_active | default(false) | bool)
