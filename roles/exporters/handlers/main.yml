---
# Both handlers reload the unit files before restarting: a template change is
# invisible to systemd until daemon-reload runs, and a restart on a stale
# definition looks like success while changing nothing.

- name: Restart node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter.service
    state: restarted
    daemon_reload: true

- name: Restart nvidia_gpu_exporter
  ansible.builtin.systemd_service:
    name: nvidia_gpu_exporter.service
    state: restarted
    daemon_reload: true
