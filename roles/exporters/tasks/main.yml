---
# Explicit, not useradd's user-private-group default: the units name a Group=,
# and a unit that cannot resolve its group fails to start.
- name: Create the exporter system groups
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
    state: present
  loop:
    - "{{ exporters_node_user }}"
    - "{{ exporters_gpu_user }}"

- name: Create the exporter system users
  ansible.builtin.user:
    name: "{{ item }}"
    group: "{{ item }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
  loop:
    - "{{ exporters_node_user }}"
    - "{{ exporters_gpu_user }}"

- name: Create the exporter staging directory
  ansible.builtin.file:
    path: "{{ exporters_download_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# setgid so the shared group can drop .prom files without root; node_exporter
# reads them unprivileged, so they must stay world-readable.
- name: Create the node_exporter textfile collector directory
  ansible.builtin.file:
    path: "{{ exporters_textfile_dir }}"
    state: directory
    owner: root
    group: "{{ spark_shared_group }}"
    mode: "2775"

- name: Download the node_exporter release archive
  ansible.builtin.get_url:
    url: "{{ exporters_node_release_url }}/{{ exporters_node_archive }}"
    dest: "{{ exporters_download_dir }}/{{ exporters_node_archive }}"
    checksum: "sha256:{{ exporters_node_release_url }}/{{ exporters_node_checksums }}"
    owner: root
    group: root
    mode: "0644"

- name: Unpack the node_exporter release archive
  ansible.builtin.unarchive:
    src: "{{ exporters_download_dir }}/{{ exporters_node_archive }}"
    dest: "{{ exporters_download_dir }}"
    remote_src: true
    creates: "{{ exporters_node_unpack_dir }}/node_exporter"
    owner: root
    group: root
    mode: "0755"

- name: Install the node_exporter binary
  ansible.builtin.copy:
    src: "{{ exporters_node_unpack_dir }}/node_exporter"
    dest: "{{ exporters_bin_dir }}/node_exporter"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart node_exporter

- name: Create the nvidia_gpu_exporter staging directory
  ansible.builtin.file:
    path: "{{ exporters_gpu_unpack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the nvidia_gpu_exporter release archive
  ansible.builtin.get_url:
    url: "{{ exporters_gpu_release_url }}/{{ exporters_gpu_archive }}"
    dest: "{{ exporters_download_dir }}/{{ exporters_gpu_archive }}"
    checksum: "sha256:{{ exporters_gpu_release_url }}/{{ exporters_gpu_checksums }}"
    owner: root
    group: root
    mode: "0644"

- name: Unpack the nvidia_gpu_exporter release archive
  ansible.builtin.unarchive:
    src: "{{ exporters_download_dir }}/{{ exporters_gpu_archive }}"
    dest: "{{ exporters_gpu_unpack_dir }}"
    remote_src: true
    creates: "{{ exporters_gpu_unpack_dir }}/nvidia_gpu_exporter"
    owner: root
    group: root
    mode: "0755"

- name: Install the nvidia_gpu_exporter binary
  ansible.builtin.copy:
    src: "{{ exporters_gpu_unpack_dir }}/nvidia_gpu_exporter"
    dest: "{{ exporters_bin_dir }}/nvidia_gpu_exporter"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart nvidia_gpu_exporter

- name: Install the node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Install the nvidia_gpu_exporter systemd unit
  ansible.builtin.template:
    src: nvidia_gpu_exporter.service.j2
    dest: /etc/systemd/system/nvidia_gpu_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart nvidia_gpu_exporter

# daemon_reload here as well as in the handlers: on a first run the unit file
# is brand new and systemd has to be told about it before it can be enabled.
- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter.service
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start nvidia_gpu_exporter
  ansible.builtin.systemd_service:
    name: nvidia_gpu_exporter.service
    enabled: true
    state: started
    daemon_reload: true
