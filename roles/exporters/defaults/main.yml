---
exporters_download_dir: /usr/local/src
exporters_bin_dir: /usr/local/bin

# get_url is handed the checksum file's URL rather than a pinned hash that rots.
exporters_node_release_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}"
exporters_node_archive: "node_exporter-{{ node_exporter_version }}.linux-arm64.tar.gz"
exporters_node_checksums: sha256sums.txt
# The node_exporter archive carries its own version prefix inside it.
exporters_node_unpack_dir: "{{ exporters_download_dir }}/node_exporter-{{ node_exporter_version }}.linux-arm64"

exporters_gpu_release_url: "https://github.com/utkuozdemir/nvidia_gpu_exporter/releases/download/v{{ nvidia_gpu_exporter_version }}"
exporters_gpu_archive: "nvidia_gpu_exporter_{{ nvidia_gpu_exporter_version }}_linux_arm64.tar.gz"
exporters_gpu_checksums: checksums.txt
# This archive is flat, so the version has to come from a directory we make.
exporters_gpu_unpack_dir: "{{ exporters_download_dir }}/nvidia_gpu_exporter-{{ nvidia_gpu_exporter_version }}"

exporters_node_user: node_exporter
exporters_gpu_user: nvidia_gpu_exporter

# node_exporter runs unprivileged, so every .prom file here must be
# world-readable or it is skipped in silence.
exporters_textfile_dir: /var/lib/node_exporter/textfile

exporters_node_collectors:
  - cpu
  - meminfo
  - loadavg
  - hwmon
  - thermal_zone
  - netdev
  - uname
  - os
  - textfile
  - filesystem
  # `stat` exports node_boot_time_seconds; the uptime panel is blank without it.
  - stat

# Without these the filesystem collector recurses the snap loop devices and every
# Docker overlay, hangs, and flaps `up` to 0. `$` is written `$$` in the unit.
exporters_node_filesystem_mount_points_exclude: "^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/snapd/.+)($|/)"
exporters_node_filesystem_fs_types_exclude: "^(autofs|overlay|squashfs|tmpfs|devtmpfs|nsfs|cgroup.*)$"

exporters_nvidia_smi_command: /usr/bin/nvidia-smi

# Explicit, not the exporter's AUTO, so the throttle-reason fields are guaranteed.
# `clocks_event_reasons.*` is the driver-580 spelling; identity fields are appended.
exporters_gpu_query_fields:
  - utilization.gpu
  - utilization.memory
  - temperature.gpu
  - power.draw
  - power.limit
  - enforced.power.limit
  - clocks.current.graphics
  - clocks.current.sm
  - clocks.current.memory
  - clocks.current.video
  - clocks.max.sm
  - clocks.max.graphics
  - pstate
  - persistence_mode
  - compute_mode
  - fan.speed
  - clocks_event_reasons.supported
  - clocks_event_reasons.active
  - clocks_event_reasons.gpu_idle
  - clocks_event_reasons.applications_clocks_setting
  - clocks_event_reasons.sw_power_cap
  - clocks_event_reasons.hw_slowdown
  - clocks_event_reasons.hw_thermal_slowdown
  - clocks_event_reasons.hw_power_brake_slowdown
  - clocks_event_reasons.sw_thermal_slowdown
  - clocks_event_reasons.sync_boost
  - clocks_event_reasons_counters.sw_power_cap
  - clocks_event_reasons_counters.sw_thermal_slowdown
  - clocks_event_reasons_counters.hw_thermal_slowdown
  - clocks_event_reasons_counters.hw_power_brake_slowdown
  - clocks_event_reasons_counters.sync_boost
