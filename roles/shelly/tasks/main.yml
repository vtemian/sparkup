---
- name: Install the Shelly power exporter
  when: shelly_enabled | bool
  block:
    # Without a plug address the exporter still answers /metrics and reads up == 1
    # while exporting no power at all. Refuse rather than converge.
    - name: Assert the Shelly exporter is configured before installing it
      ansible.builtin.assert:
        that:
          - shelly_host | default('', true) | trim | length > 0
        fail_msg: >-
          shelly_enabled is on but shelly_host is empty. shelly_host must be the
          plug's reserved IP address — not a .local name, which the container
          cannot resolve.

    - name: Pull the Shelly exporter image
      community.docker.docker_image_pull:
        name: "{{ shelly_image_ref }}"
        # not_present, not the default `always`: a digest is immutable, so re-asking
        # the registry every converge only makes an offline run need the internet.
        pull: not_present

    - name: Install the Shelly exporter systemd unit
      ansible.builtin.template:
        src: shelly_exporter.service.j2
        dest: "/etc/systemd/system/{{ shelly_unit_name }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart shelly_exporter

    # daemon_reload here as well as in the handler: on a first run the unit
    # file is brand new and systemd has to be told about it before it can be
    # enabled.
    - name: Enable and start the Shelly exporter
      ansible.builtin.systemd_service:
        name: "{{ shelly_unit_name }}"
        enabled: true
        state: started
        daemon_reload: true
