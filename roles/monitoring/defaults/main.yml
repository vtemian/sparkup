---
# The project name, not the directory, namespaces the named volumes. Changing it
# abandons grafana-data (hand-made dashboards) and prometheus-data (history).
monitoring_project_name: spark-monitoring

# Not under /var/lib/grafana: that path is the named volume's, and nesting a bind
# mount inside it is a needless ordering dependency.
monitoring_dashboards_container_dir: /etc/grafana/dashboards

monitoring_grafana_anonymous_role: Viewer
monitoring_grafana_theme: dark
monitoring_grafana_home_dashboard: /d/spark-overview/spark-overview

# The one panel type the dashboard needs that Grafana does not ship: the power
# flow diagram is a sankey, and there is no built-in sankey visualisation.
#
# Downloaded and checksummed by this role rather than fetched by grafana-cli
# through GF_INSTALL_PLUGINS. The box is headless on WiFi, and a Grafana that
# reaches out to grafana.com at every container start is a Grafana that comes up
# without its plugin whenever the link is down, leaving a broken panel and no
# error anybody sees. This way the converge fails loudly instead.
monitoring_grafana_plugin: volkovlabs-echarts-panel
monitoring_grafana_plugin_version: 7.2.5
monitoring_grafana_plugin_checksum: sha256:e49f520eef92f391d11c77a94f5503b540451e9e755da9ac5cb3553a8e5db3b5
monitoring_grafana_plugin_url: >-
  https://grafana.com/api/plugins/{{ monitoring_grafana_plugin }}/versions/{{
  monitoring_grafana_plugin_version }}/download
