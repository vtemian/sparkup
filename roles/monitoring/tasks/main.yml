---
- name: Create the monitoring stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ monitoring_dir }}/prometheus"
    # Bind-mounted into Prometheus, so it must exist before the stack comes up:
    # Docker would otherwise create it root-owned as a directory anyway, but on
    # its own terms and after the container has already read the config.
    - "{{ monitoring_rules_dir }}"
    - "{{ monitoring_rules_staging_dir }}"
    - "{{ monitoring_dir }}/grafana/dashboards"
    - "{{ monitoring_dir }}/grafana/provisioning/datasources"
    - "{{ monitoring_dir }}/grafana/provisioning/dashboards"
    # Empty on purpose: Grafana logs a provisioning error at every start for each
    # of these it cannot open.
    - "{{ monitoring_dir }}/grafana/provisioning/alerting"
    - "{{ monitoring_dir }}/grafana/provisioning/plugins"
    # Where the panel plugin is unpacked. Only the plugin's own directory inside
    # this one is mounted, into Grafana's plugin root rather than over it.
    - "{{ monitoring_dir }}/grafana/plugins"

# A literal hash, not a checksum-file URL as in the exporters role: grafana.com
# publishes no sums file beside the download, so the version and the hash are
# pinned together here and a bumped version with a stale hash fails the converge.
- name: Fetch the Grafana panel plugin archive
  ansible.builtin.get_url:
    url: "{{ monitoring_grafana_plugin_url }}"
    dest: "{{ monitoring_dir }}/{{ monitoring_grafana_plugin }}-{{ monitoring_grafana_plugin_version }}.zip"
    checksum: "{{ monitoring_grafana_plugin_checksum }}"
    owner: root
    group: root
    mode: "0644"

# `creates` names the VERSION, not just the plugin: the archive always unpacks to
# a directory called after the plugin, so a guard on that path alone is satisfied
# by whatever version is already there. A bump would then fetch the new zip, skip
# the unpack, fire no handler, report success, and leave Grafana serving the old
# version forever. The exporters role scopes its guard the same way.
- name: Unpack the Grafana panel plugin the power flow diagram needs
  ansible.builtin.unarchive:
    src: "{{ monitoring_dir }}/{{ monitoring_grafana_plugin }}-{{ monitoring_grafana_plugin_version }}.zip"
    dest: "{{ monitoring_dir }}/grafana/plugins"
    remote_src: true
    creates: "{{ monitoring_grafana_plugin_stamp }}"
  # No owner/group/mode: the archive already carries 0664 files under 0775
  # directories, and forcing a file mode here would strip the execute bit the
  # directories need for Grafana's own uid to traverse them.
  notify: Restart monitoring stack

- name: Record which plugin version is unpacked
  ansible.builtin.copy:
    content: "{{ monitoring_grafana_plugin_version }}\n"
    dest: "{{ monitoring_grafana_plugin_stamp }}"
    owner: root
    group: root
    mode: "0644"

# The bind mount cannot fail loudly on its own: Docker creates a missing bind
# source as an empty directory, so a plugin that never landed gives a Grafana that
# starts clean and a panel reading "plugin not found" with a green converge.
# Neither dashboard check can see it either; they read queries, not panel types.
- name: Assert the panel plugin is where Grafana will look for it
  ansible.builtin.stat:
    path: "{{ monitoring_dir }}/grafana/plugins/{{ monitoring_grafana_plugin }}/plugin.json"
  register: monitoring_plugin_manifest
  changed_when: false

- name: Fail if the panel plugin did not unpack
  ansible.builtin.assert:
    that: monitoring_plugin_manifest.stat.exists
    fail_msg: >-
      {{ monitoring_grafana_plugin }} did not unpack into
      {{ monitoring_dir }}/grafana/plugins. Grafana would start without it and the
      dashboard's power flow panel would read "plugin not found". Check that unzip
      is installed and that the archive's top-level directory is still named after
      the plugin.

- name: Template the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ monitoring_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart monitoring stack

- name: Stage the alerting rules
  ansible.builtin.copy:
    src: "rules/{{ monitoring_rules_file }}"
    dest: "{{ monitoring_rules_staging_dir }}/{{ monitoring_rules_file }}"
    owner: root
    group: root
    mode: "0644"
  check_mode: false
  # Nothing on the box behaves differently because a file appeared in a scratch
  # directory. The install task below is the one whose changed-ness means something.
  changed_when: false

- name: Validate the staged rules with promtool
  # promtool ships inside the Prometheus image this role already pulled, so it
  # cannot drift from the version that will load the file.
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --volume
      - "{{ monitoring_rules_staging_dir }}:/staged:ro"
      - --entrypoint
      - promtool
      - "{{ prometheus_image }}"
      - check
      - rules
      - "/staged/{{ monitoring_rules_file }}"
  register: monitoring_promtool
  changed_when: false
  check_mode: false
  # The assert reports promtool's own explanation, which a task failure would hide.
  failed_when: false

- name: Assert that the alerting rules are valid
  ansible.builtin.assert:
    that:
      - monitoring_promtool.rc == 0
    fail_msg: >-
      promtool rejected roles/monitoring/files/rules/{{ monitoring_rules_file }}, so
      it has NOT been installed and Prometheus is untouched and still running.
      {{ monitoring_promtool.stdout | default('', true) }}
      {{ monitoring_promtool.stderr | default('', true) }}
    success_msg: promtool accepts the alerting rules.

- name: Install the alerting rules
  ansible.builtin.copy:
    src: "{{ monitoring_rules_staging_dir }}/{{ monitoring_rules_file }}"
    remote_src: true
    dest: "{{ monitoring_rules_dir }}/{{ monitoring_rules_file }}"
    owner: root
    group: root
    mode: "0644"
  # Reload rather than restart: the TSDB head survives.
  notify: Reload Prometheus configuration

- name: Template the Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Prometheus configuration

- name: Provision the Grafana datasource
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/datasource.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart monitoring stack

- name: Provision the Grafana dashboard provider
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: "{{ monitoring_dir }}/grafana/provisioning/dashboards/dashboards.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart monitoring stack

# Copied, not templated: the JSON is full of Grafana's own {{label}} legend syntax,
# which Jinja would eat.
- name: Install the provisioned dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ monitoring_dir }}/grafana/dashboards/"
    owner: root
    group: root
    mode: "0644"

- name: Bring the monitoring stack up
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    project_name: "{{ monitoring_project_name }}"
    state: present
    pull: missing
    remove_orphans: true
    wait: true
