---
# avahi is not optional: it publishes <hostname>.local, which every other role
# here assumes resolves.
- name: Install the base utilities and the avahi daemon
  ansible.builtin.apt:
    name:
      - rsync
      - curl
      - util-linux
      - python3-apt
      - avahi-daemon
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start the avahi daemon
  ansible.builtin.systemd_service:
    name: avahi-daemon
    enabled: true
    state: started

- name: Set the system hostname
  ansible.builtin.hostname:
    name: "{{ spark_hostname }}"
  notify: Restart avahi-daemon

# Debian family resolves the machine's own name through 127.0.1.1. A stale entry
# makes sudo pause on every invocation.
- name: Keep the 127.0.1.1 entry in /etc/hosts consistent with the hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ spark_hostname }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart avahi-daemon

- name: Set the system timezone
  community.general.timezone:
    name: "{{ base_timezone }}"
  when: base_timezone | default('', true) | trim | length > 0

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

# ADD allow rules only. No reset, no delete: this box's only link is WiFi, so a
# mistake means walking to it.
- name: Allow inbound service ports through ufw
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ spark_firewall_allow_ports }}"

# Prometheus scrapes the host exporters from a container via the docker bridge
# gateway; default-deny drops that traffic without these rules.
- name: Allow containers to reach the host exporters
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.0 }}"
    port: "{{ item.1 }}"
    proto: tcp
  loop: "{{ spark_firewall_docker_subnets | product(spark_firewall_container_ports) | list }}"
  loop_control:
    label: "{{ item.0 }} -> {{ item.1 }}"

# The port sshd actually answered on, read off this connection rather than
# assumed: a box reached on a non-default port would otherwise pass the assert
# below on the strength of 22 being allowed, and lose its own session.
- name: Record the port this connection arrived on
  ansible.builtin.set_fact:
    base_firewall_live_ssh_port: >-
      {{ ansible_env.SSH_CONNECTION | default('', true)
         | regex_search('(\d+)$') | default(spark_firewall_ssh_port, true) }}

# Ordering matters: the allow rules above must already be applied when ufw
# switches to default-deny.
- name: Refuse to enable the firewall without an SSH allow rule
  ansible.builtin.assert:
    that:
      - base_firewall_live_ssh_port | int in (spark_firewall_allow_ports | map('int') | list)
    fail_msg: >-
      This connection arrived on port {{ base_firewall_live_ssh_port }}, which is
      not in spark_firewall_allow_ports. Enabling ufw sets a default-deny policy
      and would drop your own session on a box whose only link is WiFi. Add the
      port to spark_firewall_allow_ports.
    success_msg: >-
      This connection arrived on port {{ base_firewall_live_ssh_port }}, which is
      allowed, so enabling ufw cannot close the way in.

- name: Enable the firewall
  community.general.ufw:
    state: enabled
