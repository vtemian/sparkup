---
# Reads and asserts; never flashes. Drift detection only: if the EC firmware
# moved without somebody here changing thermal_expected_ec_firmware, say so and
# stop, because the alternative is finding out from a sensor reading badly.

- name: Look for the firmware update client
  ansible.builtin.stat:
    path: "{{ thermal_fwupdmgr_command }}"
  register: thermal_fwupdmgr

- name: Manage the firmware update path
  when: thermal_fwupdmgr.stat.exists
  block:
    - name: Read the firmware inventory
      ansible.builtin.command:
        cmd: "{{ thermal_fwupdmgr_command }} get-devices --json"
      register: thermal_fwupd_devices
      changed_when: false
      failed_when: false
      check_mode: false
      when: thermal_ec_device_id | default('', true) | trim | length > 0

    # Empty covers all three "no version to assert" cases, so the assert skips.
    - name: Record the embedded controller firmware version
      ansible.builtin.set_fact:
        thermal_ec_version: >-
          {{ (thermal_fwupd_devices.stdout | from_json).get('Devices', [])
             | selectattr('DeviceId', 'defined')
             | selectattr('DeviceId', 'equalto', thermal_ec_device_id)
             | map(attribute='Version')
             | first | default('', true) }}
      when:
        - thermal_fwupd_devices.rc | default(1) == 0
        - thermal_fwupd_devices.stdout | default('') is search('Devices')

    - name: Assert that the embedded controller firmware has not drifted
      ansible.builtin.assert:
        that:
          - thermal_ec_version == thermal_expected_ec_firmware
        fail_msg: >-
          EC firmware is {{ thermal_ec_version }}, expected
          {{ thermal_expected_ec_firmware }}. Something flashed this box. This
          role never does, and it will not put the old version back:
          `fwupdmgr downgrade {{ thermal_ec_device_id }}` is the manual route,
          and it reboots. If the new version is intended, update
          thermal_expected_ec_firmware.
        success_msg: >-
          EC firmware is {{ thermal_expected_ec_firmware }}, as expected.
      when:
        - thermal_ec_version | default('', true) | length > 0
        - thermal_expected_ec_firmware | default('', true) | trim | length > 0
