---
# Gated, because a restart would *start* a stopped oneshot. Without the gate a
# harmless template edit would apply a clock cap on a box whose owner left the
# flag off — the failure mode is silent, and it changes how fast their GPU runs.
- name: Restart the GPU clock cap
  ansible.builtin.systemd_service:
    name: "{{ thermal_gpu_clock_cap_unit }}"
    state: restarted
  when: thermal_gpu_clock_cap_enabled | bool
