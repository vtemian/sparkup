---
# Off. Installing an out-of-tree kernel module is not something a converge
# should do to a box that did not ask for it.
spbm_enabled: false

# The PPA that carries the DKMS package. Built from antheas/spark_hwmon by
# github.com/vtemian/spark-spbm-builder; nothing is compiled on this box beyond
# what DKMS does against the running kernel.
spbm_ppa: ppa:vtemian/spark-spbm
spbm_package: spbm-dkms

# DKMS rebuilds the module for each new kernel, but only if headers for that
# kernel arrive with it. This meta package is what guarantees that; without it
# the module silently vanishes on the next kernel upgrade.
spbm_headers_package: linux-headers-nvidia-hwe-24.04

# Secure Boot rejects unsigned modules. DKMS signs with this key, and a human
# must enrol it once at the console before the module can load.
spbm_mok_cert: /var/lib/shim-signed/mok/MOK.der

# The one-time password typed at the MokManager screen on the next boot. Empty
# means the package is installed but the key is never queued, leaving the
# module built and unloadable. Pass it with `-e spbm_mok_password=...` for a
# single run so it stays out of every file.
spbm_mok_password: ""
