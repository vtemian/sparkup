---
# Built from antheas/spark_hwmon by github.com/vtemian/spark-spbm-builder.
spbm_ppa: ppa:vladtemian/spark-spbm
spbm_package: spbm-dkms

# The meta package, not a versioned one: without headers arriving with each new
# kernel the module silently vanishes on the next upgrade.
spbm_headers_package: linux-headers-nvidia-hwe-24.04

# DKMS signs with this key; a human enrols it once at the console.
spbm_mok_cert: /var/lib/shim-signed/mok/MOK.der

# NOT A SECRET, and do not put one here. It is typed once at the MokManager
# screen to prove somebody is physically at the box, then discarded — anyone who
# can reach that screen is already at the keyboard. The converge prints it,
# because whoever has to type it is usually not whoever ran the playbook.
spbm_mok_password: sparkup
