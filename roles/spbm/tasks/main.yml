---
# Whole-system power and energy, read from the firmware's power budget region.
# nvidia-smi sees the GPU rail alone, which is roughly half of what the box draws.
#
# Secure Boot will not load a module signed by an untrusted key, and a key only
# enters the trust store through MokManager, at the console. This role installs
# the driver and queues the key; a human finishes it with a keyboard.

# Said out loud on every converge, not buried in a role README: this installs
# third-party code that runs in kernel space, and whoever runs the playbook is
# the one making that trust decision.
- name: Name the third-party source this driver comes from
  ansible.builtin.debug:
    msg: >-
      Installing spbm, a DKMS kernel module, from {{ spbm_ppa }}. Source:
      github.com/antheas/spark_hwmon, packaged by
      github.com/vtemian/spark-spbm-builder. It runs in kernel space and is not
      part of Ubuntu or DGX OS. It is what provides whole-system power and
      energy; drop the spbm role from site.yml if you would rather not have it.

- name: Add the PPA carrying the DKMS package
  ansible.builtin.apt_repository:
    repo: "{{ spbm_ppa }}"
    state: present
    update_cache: true
    filename: spark-spbm

# Before the module: DKMS needs headers to build against.
- name: Ensure kernel headers arrive with every new kernel
  ansible.builtin.apt:
    name: "{{ spbm_headers_package }}"
    state: present

- name: Install the SPBM DKMS package
  ansible.builtin.apt:
    name: "{{ spbm_package }}"
    state: present

- name: Install the Secure Boot key enrolment tool
  ansible.builtin.apt:
    name: mokutil
    state: present

- name: Check whether the module signing key is already enrolled
  ansible.builtin.command:
    cmd: mokutil --test-key {{ spbm_mok_cert }}
  register: spbm_mok_test
  changed_when: false
  failed_when: false
  check_mode: false

# Queuing is not idempotent on its own — `mokutil --import` reports a change
# every run — so the request already sitting in MokNew is what makes a second
# converge quiet.
- name: Read the keys already queued for enrolment
  ansible.builtin.command:
    cmd: mokutil --list-new
  register: spbm_mok_queued
  changed_when: false
  failed_when: false
  check_mode: false

# Matched on the CN value alone: `--list-new` and `openssl -subject` disagree
# about the spaces around the `=`, and only the value is stable between them.
- name: Read the signing key's common name
  ansible.builtin.command:
    cmd: openssl x509 -in {{ spbm_mok_cert }} -inform DER -noout -subject
  register: spbm_mok_subject
  changed_when: false
  check_mode: false

- name: Queue the module signing key for enrolment
  when:
    - "'is already enrolled' not in (spbm_mok_test.stdout | default(''))"
    - spbm_mok_common_name not in (spbm_mok_queued.stdout | default(''))
  vars:
    spbm_mok_common_name: >-
      {{ spbm_mok_subject.stdout | regex_replace('^.*?CN\s*=\s*', '') | regex_replace(',.*$', '') | trim }}
  block:

    # mokutil prompts on a tty, which Ansible cannot answer. --generate-hash
    # plus --hash-file is the documented way round it.
    - name: Hash the enrolment password
      ansible.builtin.shell:
        cmd: >-
          umask 077 &&
          mokutil --generate-hash='{{ spbm_mok_password }}' > /root/.spbm-mok-hash
      changed_when: true
      no_log: true

    # Before the import, so a request never exists under the 10s default.
    - name: Give MokManager long enough for a display to wake up
      ansible.builtin.command:
        cmd: mokutil --timeout {{ spbm_mok_timeout }}
      changed_when: true

    - name: Queue the key for enrolment at the next boot
      ansible.builtin.command:
        cmd: mokutil --import {{ spbm_mok_cert }} --hash-file /root/.spbm-mok-hash
      register: spbm_mok_import
      changed_when: spbm_mok_import.rc == 0

    - name: Remove the hash file
      ansible.builtin.file:
        path: /root/.spbm-mok-hash
        state: absent

# Outside the block so it prints on every converge until the key is trusted,
# not only on the run that queued it.
- name: Report what the operator has to do at the console
  ansible.builtin.debug:
    msg: >-
      POWER TELEMETRY IS QUEUED, NOT YET LIVE. The driver is built and signed,
      but Secure Boot will not load it until its key is trusted. Reboot, and
      before the OS loads shim shows a blue MokManager screen: Enroll MOK,
      Continue, Yes, then type "{{ spbm_mok_password }}". It needs a keyboard
      and a monitor attached; there is no network and no SSH at that point. The
      screen waits {{ spbm_mok_timeout }}s — if your display has not woken by
      then it cancels and the key is discarded, so re-run this role and try
      again. Until the key is enrolled node_hwmon_power_input_watt returns
      nothing.
  when: "'is already enrolled' not in (spbm_mok_test.stdout | default(''))"
