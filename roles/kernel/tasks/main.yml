---
# This role NEVER reboots. The box is headless, WiFi-only and has already
# failed to boot once over kernel signatures; power-cycling it is a human's call.

# dpkg-query, never `apt-cache depends`: apt-cache answers for the *candidate*
# version, so a newer kernel in the vendor archive becomes "the intended" one.
- name: Read the kernel image the installed meta package depends on
  ansible.builtin.command:
    cmd: dpkg-query --showformat=${Depends} --show {{ kernel_meta_package }}
  register: kernel_meta_depends
  changed_when: false
  failed_when: false
  check_mode: false

# `[0-9]` after `linux-image-` is what excludes `linux-image-unsigned-...`. The
# ansible_kernel fallback keeps this correct on a box with no vendor meta package.
- name: Resolve the kernel version this box is meant to boot
  ansible.builtin.set_fact:
    kernel_intended_version: >-
      {{ (kernel_meta_depends.stdout | default('', true)
          | regex_findall('linux-image-([0-9][A-Za-z0-9.+~-]*)')
          | first | default('', true))
         or ansible_kernel }}

# Install before anything points at it. `state: present`, never `latest`: this
# converges the kernel the box already boots, it does not look for newer ones.
- name: Install the signed kernel and its meta package
  ansible.builtin.apt:
    name: >-
      {{ ([kernel_meta_package] if kernel_meta_package | trim | length > 0 else [])
         + ['linux-image-' ~ kernel_intended_version] }}
    state: present

# A drop-in, not /etc/default/grub: DGX OS ships no-grubmenu.cfg, sourced after
# the base file, which forces the menu back off. `zz-` sorts this last and wins.
- name: Show the GRUB menu, overriding any vendor drop-in that hides it
  ansible.builtin.template:
    src: zz-sparkup-menu.cfg.j2
    dest: "{{ kernel_grub_dropin_dir }}/{{ kernel_grub_dropin_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Update GRUB

# `saved` plus grub-set-default, never a menu-entry title: titles carry the
# distributor string and the version in prose, and a pin on one rots silently.
- name: Select the saved entry as GRUB's default
  ansible.builtin.lineinfile:
    path: "{{ kernel_grub_default_file }}"
    regexp: '^#?\s*GRUB_DEFAULT='
    line: GRUB_DEFAULT=saved
    owner: root
    group: root
    mode: "0644"
  notify: Update GRUB

# grub.cfg only honours ${saved_entry} once regenerated with GRUB_DEFAULT=saved.
- name: Regenerate the GRUB menu before reading it
  ansible.builtin.meta: flush_handlers

- name: Read the generated GRUB menu
  ansible.builtin.slurp:
    src: "{{ kernel_grub_config }}"
  register: kernel_grub_cfg

- name: Extract the entry ids and the resolved timeout from the GRUB menu
  ansible.builtin.set_fact:
    kernel_grub_entry_ids: >-
      {{ kernel_grub_cfg.content | b64decode
         | regex_findall("menuentry_id_option '([^']+)'") }}
    kernel_grub_menu_settings: >-
      {{ kernel_grub_cfg.content | b64decode
         | regex_findall('set timeout_style=([a-z]+)\s+set timeout=([0-9-]+)') }}
    # Read from the file, never guessed: only the file says which submenus exist.
    kernel_grub_submenu_ids: >-
      {{ kernel_grub_cfg.content | b64decode
         | regex_findall("submenu[^\n]*?menuentry_id_option '([^']+)'") }}

# Before the boot target moves, not after: verifying after would leave a moved
# boot target behind a hidden menu on a box nobody can reach.
- name: Assert that the GRUB menu will be visible
  ansible.builtin.assert:
    that:
      - kernel_grub_menu_settings | length > 0
      - kernel_grub_menu_settings[0][0] == 'menu'
      - kernel_grub_menu_settings[0][1] | int != 0
    fail_msg: >-
      {{ kernel_grub_config }} does not resolve to a visible menu
      ({{ kernel_grub_menu_settings | first | default(['unparsed', 'unparsed'], true) | join(' / ') }}).
      The usual cause is a drop-in under /etc/default/grub.d/, which is sourced
      after /etc/default/grub and wins. Fix that and re-run; do not reboot into
      a hidden menu on a box you cannot reach.
    success_msg: >-
      The menu appears for {{ kernel_grub_menu_settings[0][1] }} seconds.
  when: not ansible_check_mode

# By menu entry id, never by title. A title carries the distributor string and the
# kernel version in prose, and when it stops matching GRUB does not complain, it
# boots something else. The id embeds the kernel version and the root UUID, and
# Ubuntu nests per-kernel entries, so the saved value is `<submenu id>><entry id>`.
- name: Point GRUB at the signed kernel
  block:
    # A nested entry is only selectable as "<submenu id>>><entry id>"; with no
    # submenu the join collapses to the entry id alone.
    - name: Compose the saved entry that selects the intended kernel
      ansible.builtin.set_fact:
        kernel_grub_target: >-
          {{ [(kernel_grub_submenu_ids | select('match', 'gnulinux-advanced-') | list
               + kernel_grub_submenu_ids | list) | first | default('', true),
              kernel_grub_entry_ids
              | select('search', '^gnulinux-' ~ (kernel_intended_version | regex_escape) ~ '-advanced-')
              | list | first | default('', true)]
             | reject('equalto', '') | join('>') }}

    - name: Assert that GRUB has a menu entry for the intended kernel
      ansible.builtin.assert:
        that:
          - kernel_grub_target | length > 0
          - kernel_intended_version in kernel_grub_target
          # A bare nested id is unresolvable at top level: GRUB falls back to
          # entry 0, the newest kernel on disk. This one fails open, so check it.
          - kernel_grub_submenu_ids | length == 0 or '>' in kernel_grub_target
        fail_msg: >-
          {{ kernel_grub_config }} has no entry for
          {{ kernel_intended_version }}, so there is nothing safe to point the
          default at. Confirm the signed image is installed and that
          `update-grub` has run, then look at the menu by hand before doing
          anything else. This role changes no boot target it cannot name.
        success_msg: >-
          GRUB entry for {{ kernel_intended_version }} is
          "{{ kernel_grub_target }}".
      when: not ansible_check_mode

    # The idempotency guard: without it a converged box reports changed forever.
    - name: Read the saved GRUB default entry
      ansible.builtin.command: grub-editenv list
      register: kernel_grubenv
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Point GRUB's saved default at the signed kernel
      ansible.builtin.command:
        cmd: grub-set-default {{ kernel_grub_target | quote }}
      changed_when: true
      when:
        # Repeats the assertion above rather than relying on it: the assertion
        # is skipped in --check, and this is the task that moves the boot path.
        - kernel_grub_target | length > 0
        - kernel_intended_version in kernel_grub_target
        - >-
          (kernel_grubenv.stdout | default('', true)
           | regex_findall('^saved_entry=(.*)$', multiline=True)
           | first | default('', true)) != kernel_grub_target

# An apt pin, not a dpkg hold: a hold only constrains packages already
# installed, and the failure here is an update pulling in a NEW unsigned image.
- name: Pin unsigned kernel images out of apt
  ansible.builtin.copy:
    src: no-unsigned-kernels
    dest: "{{ kernel_apt_preferences_file }}"
    owner: root
    group: root
    mode: "0644"

# Not an assert: needing a reboot is the correct end state of a first converge,
# not a fault, and failing here would stop the play before the summary that
# tells somebody what that reboot does. site.yml checks Secure Boot up front.
- name: Report that the signed kernel is installed but not yet running
  ansible.builtin.debug:
    msg: >-
      A REBOOT IS REQUIRED to finish. Running {{ ansible_kernel }}; intended
      {{ kernel_intended_version }}. Everything this role can do is done: the
      signed kernel is installed, GRUB points at it and the menu is visible.
      Nothing here will reboot for you. Do it by hand, with somebody able to
      reach the machine physically.
  when: ansible_kernel != kernel_intended_version
