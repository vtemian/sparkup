---
# DGX OS packaging; exists nowhere else. On a non-DGX box the install dies with
# "No package matching ..." — set it to "" there and discovery falls back.
kernel_meta_package: linux-image-nvidia-hwe-24.04

# The only thing between a bad kernel and a drive to wherever the box lives.
kernel_grub_timeout: 5
kernel_grub_recordfail_timeout: 5

kernel_grub_dropin_dir: /etc/default/grub.d
kernel_grub_dropin_name: zz-sparkup-menu.cfg

kernel_grub_default_file: /etc/default/grub
kernel_grub_config: /boot/grub/grub.cfg

kernel_apt_preferences_file: /etc/apt/preferences.d/no-unsigned-kernels
