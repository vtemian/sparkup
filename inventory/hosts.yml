---
# One host. Change ansible_host and ansible_user to yours, then edit
# host_vars/spark.yml (copy it from the .example first).
#
# Keep the host NAMED `spark` whatever your machine is called: ansible_host
# carries the real address, and renaming the host here would orphan its
# host_vars file silently.
all:
  hosts:
    spark:
      ansible_host: spark.local
      ansible_user: vlad
