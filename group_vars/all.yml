---
# Defaults that suit any DGX Spark. Nothing personal belongs in this file —
# put users, shared paths and anything site-specific in host_vars/<host>.yml.

spark_hostname: spark

# Accounts the playbook manages. Empty by default: a fresh clone must not
# invent users on someone else's box. See host_vars/spark.yml for the shape.
#   - name: alice
#     groups: [sudo, docker]
#     github_keys: alice-on-github   # or false to manage keys yourself
spark_users: []

# Shared artifact tree, deliberately outside any directory that a laptop
# rsyncs with --delete. setgid so members of the group share what they write.
spark_shared_dir: /srv/spark
spark_shared_group: spark
spark_shared_subdirs: [data, checkpoints, runs]

# ufw: this role only ever ADDS allow rules. It never resets the firewall and
# never sets a default deny policy — locking yourself out of a box whose only
# link is WiFi means walking to it.
spark_firewall_manage: true
spark_firewall_allow_ports: [22, 80]

# Docker's apt repo is added ONLY when Docker is absent. DGX OS ships Docker
# from repo.download.nvidia.com; adding upstream on top fights the vendor.
docker_manage_upstream_repo: true

# nvidia-container-toolkit is not in stock Ubuntu — it comes from NVIDIA's repo,
# which DGX OS configures. Turn this off on a box without it rather than having
# the play die partway through.
gpu_enabled: true

monitoring_dir: /opt/monitoring
prometheus_image: prom/prometheus:v3.5.0
grafana_image: grafana/grafana:12.1.0
grafana_port: 80
# Split rather than one "host:port" string: it is consumed both as a Docker
# port-binding prefix and as a URL authority, and a value valid for one is not
# always valid for the other.
prometheus_bind_address: "127.0.0.1"
prometheus_port: 9090
prometheus_retention: 30d
prometheus_scrape_interval: 15s
# The training-observability project pushes per-step samples with true
# timestamps. Turning this off breaks that contract.
prometheus_enable_remote_write_receiver: true

# Verified to publish linux-arm64 assets. Several exporters are amd64-only;
# check before bumping.
node_exporter_version: "1.12.1"
node_exporter_port: 9100
nvidia_gpu_exporter_version: "1.13.1"
nvidia_gpu_exporter_port: 9835

# Wall-socket power. nvidia-smi sees the GPU rail only and underreports the
# wall by roughly 2x, so cost is measured at the socket or not measured at all.
# Off until the plug exists, has joined the 2.4 GHz SSID and holds a DHCP
# reservation: a permanently-red target teaches people to ignore red targets.
shelly_enabled: false

# TWO DIFFERENT HOSTS, and confusing them is the bug this pair exists to
# prevent. shelly_host is the PLUG — the exporter's configuration, the device
# it polls over JSON-RPC. It is never a scrape target: the plug speaks Shelly
# RPC, not the Prometheus exposition format. Use the reserved IP rather than a
# .local name; the exporter runs in a container with no mDNS resolver.
shelly_host: ""
# shelly_scrape_host is where PROMETHEUS looks. The exporter is a separate
# process on the Spark, and Prometheus is containerised, so it reaches the host
# through the host-gateway alias — exactly as the node and gpu jobs do.
shelly_scrape_host: host.docker.internal
shelly_exporter_port: 9924

# easimon/shelly-exporter: of the three maintained candidates it is the only
# one that exports cumulative watt-hours as a Prometheus counter, which is the
# whole point (roles/shelly/README.md has the evidence). Verified to carry
# linux/arm64 in its manifest index — several exporters are amd64-only — and
# pinned by that index digest, which is the image's checksum.
shelly_exporter_version: "3.0.0"
shelly_exporter_image_digest: "sha256:3032562bcff4415a39de32a169ac2c2e200ae27c9bed551cded3831d31437ac9"
# Spring Boot's actuator serves the exposition format at /prometheus, not at
# the /metrics every other exporter here uses.
shelly_exporter_metrics_path: /prometheus

# A container restart is survivable mid-training; set this false to refuse
# disruptive work while a GPU process is running.
spark_allow_docker_restart: true
